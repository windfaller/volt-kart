<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Volt Kart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
    <div id="vignette"></div>
    <button id="mute-btn" type="button" aria-label="Mute audio" title="Mute">🔊</button>
    <div id="title-screen" class="overlay">
      <div class="title-glow"></div>
      <div class="title-card">
        <p class="title-kicker">Sunset Island Circuit</p>
        <h1 class="logo">VOLT<span>KART</span></h1>
        <p class="tagline">Drift the coast. Steal the boost. Take the flag.</p>
        <button id="start-btn" type="button" class="primary-btn">START RACE</button>
        <div class="controls-legend">
          <div><kbd>W</kbd> <kbd>↑</kbd> Accelerate</div>
          <div><kbd>S</kbd> <kbd>↓</kbd> Brake / Reverse</div>
          <div><kbd>A</kbd> <kbd>D</kbd> <kbd>←</kbd> <kbd>→</kbd> Steer</div>
          <div><kbd>Space</kbd> <kbd>Shift</kbd> Hop / Drift</div>
          <div><kbd>E</kbd> <kbd>Ctrl</kbd> Use Item</div>
          <div><kbd>M</kbd> Mute</div>
        </div>
        <p class="hint">3 laps · 6 racers · drift to charge mini-turbo</p>
      </div>
    </div>
    <div id="countdown" class="overlay hidden">
      <div id="countdown-num">3</div>
    </div>
    <div id="finish-screen" class="overlay hidden">
      <div class="finish-card">
        <h2>RACE COMPLETE</h2>
        <p id="finish-place" class="finish-place"></p>
        <ol id="standings"></ol>
        <button id="rematch-btn" type="button" class="primary-btn">REMATCH</button>
      </div>
    </div>
    <div id="touch-controls" class="touch-controls">
      <div class="touch-cluster left">
        <button type="button" data-key="left" aria-label="Steer left">◀</button>
        <button type="button" data-key="right" aria-label="Steer right">▶</button>
      </div>
      <div class="touch-cluster right">
        <button type="button" data-key="item" class="item-touch" aria-label="Use item">ITEM</button>
        <button type="button" data-key="drift" aria-label="Hop and drift">DRIFT</button>
        <div class="pedals">
          <button type="button" data-key="brake" aria-label="Brake">BRAKE</button>
          <button type="button" data-key="accel" class="accel" aria-label="Accelerate">GAS</button>
        </div>
      </div>
    </div>
  </div>
<script type="module" src="js/main.js"></script>
</body>
</html>
